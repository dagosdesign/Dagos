<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Lexistencehub</title>
    <link rel="preload" as="image" href="/brand/wordmark.png" />
    <link rel="preload" as="image" href="/brand/tagline.png" />
    <style>
      /* Opening animation: the logo comes out of the dark while the app loads behind it.
         Lives here, not in React, so it is on screen from the very first frame.
         src/lib/intro.ts removes it once the app is ready and the animation has played. */
      html, body { background: #050505; }
      #intro {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #050505;
        transition: opacity 0.45s ease, visibility 0s linear 0.45s;
      }
      #intro.intro-out { opacity: 0; visibility: hidden; }
      #intro .intro-glow {
        position: absolute; width: 140vmin; height: 140vmin; border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 184, 46, 0.10) 0%, rgba(245, 184, 46, 0) 55%);
        opacity: 0;
      }
      #intro .intro-mark {
        position: relative; width: min(72vw, 360px); aspect-ratio: 764 / 107;
        opacity: 0; filter: blur(10px); transform: scale(0.94);
        clip-path: inset(0 100% 0 0);
      }
      #intro .intro-mark img, #intro .intro-tag img { display: block; width: 100%; height: auto; }
      /* A gold light passing over the letters, shaped by the wordmark itself. */
      #intro .intro-shine {
        position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(105deg, transparent 35%, rgba(255, 236, 190, 0.95) 50%, transparent 65%);
        background-size: 250% 100%; background-position: 130% 0;
        -webkit-mask: url(/brand/wordmark.png) center / 100% 100% no-repeat;
        mask: url(/brand/wordmark.png) center / 100% 100% no-repeat;
      }
      #intro .intro-tag {
        width: calc(min(72vw, 360px) * 505 / 764); margin-top: min(4.2vw, 21px);
        opacity: 0; transform: translateY(8px);
      }
      #intro .intro-stage { display: flex; flex-direction: column; align-items: center; }
      /* The animation runs from the moment src/lib/intro.ts adds .intro-play; 5 s in all:
         0-1.6 s the wordmark opens left to right, 1.3 s the tagline rises, 2 s and 3.6 s
         a gold light passes over the letters left to right, the whole logo drifting
         slowly closer throughout. Keep INTRO_MS in src/lib/intro.ts in step. */
      #intro.intro-play .intro-stage { animation: intro-drift 5s cubic-bezier(0.33, 0, 0.2, 1) forwards; }
      #intro.intro-play .intro-glow { animation: intro-glow 5s ease-in-out 0.2s forwards; }
      #intro.intro-play .intro-mark { animation: intro-mark 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #intro.intro-play .intro-shine { animation: intro-shine 1.6s ease-in-out 2s 2; }
      #intro.intro-play .intro-tag { animation: intro-tag 1.1s cubic-bezier(0.22, 1, 0.36, 1) 1.3s forwards; }
      @keyframes intro-drift { from { transform: scale(0.97); } to { transform: scale(1.03); } }
      @keyframes intro-mark {
        60% { filter: blur(0); }
        to { opacity: 1; filter: blur(0); transform: scale(1); clip-path: inset(0 0 0 0); }
      }
      /* One pass in the first 80 %, then a short pause before the next. */
      @keyframes intro-shine { 80%, to { background-position: -30% 0; } }
      @keyframes intro-tag { to { opacity: 0.9; transform: translateY(0); } }
      @keyframes intro-glow { 30% { opacity: 1; } 60% { opacity: 0.6; } 85% { opacity: 1; } to { opacity: 0.7; } }
      @media (prefers-reduced-motion: reduce) {
        #intro.intro-play .intro-mark, #intro.intro-play .intro-tag, #intro.intro-play .intro-glow {
          animation: intro-tag 0.4s ease forwards; filter: none; clip-path: none; transform: none;
        }
        #intro.intro-play .intro-stage { animation: none; }
        #intro .intro-shine { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-glow"></div>
      <div class="intro-stage">
        <div class="intro-mark">
          <img src="/brand/wordmark.png" alt="" />
          <div class="intro-shine"></div>
        </div>
        <div class="intro-tag"><img src="/brand/tagline.png" alt="" /></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
